<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gladiator Dice – Google Play'den İndir</title>
<meta name="description" content="Gladiator Dice: Osmanlı arenasında sıra tabanlı zar savaşları. Ücretsiz, Android.">
<meta property="og:title" content="Gladiator Dice">
<meta property="og:description" content="Osmanlı arenasında sıra tabanlı zar savaşları. Google Play'de ücretsiz.">
<meta property="og:image" content="https://ersalkoray1-cyber.github.io/oyna/simge.jpg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #3a1512 0%, #1b1210 55%, #120c0a 100%);
    color: #ede3cf; text-align: center; padding: 32px 20px;
  }
  .kart { max-width: 420px; width: 100%; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  h1 { font-family: Georgia, "Times New Roman", serif; letter-spacing: .06em;
       color: #e3c05c; font-size: 30px; margin: 22px 0 6px; }
  p { margin: 6px 0; line-height: 1.5; color: #d9cdb4; }
  .buton {
    display: block; margin: 26px auto 10px; padding: 16px 20px; border-radius: 14px;
    background: linear-gradient(#2f8f3a, #1f6b29); color: #fff; font-size: 19px; font-weight: 700;
    text-decoration: none; border: 2px solid #e3c05c; box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  .ipucu { font-size: 14px; color: #b8aa8c; margin-top: 18px; }
  .ipucu b { color: #e3c05c; }
  .ios { display: none; margin-top: 22px; padding: 14px; border-radius: 12px;
         background: rgba(255,255,255,.06); font-size: 15px; }
</style>
</head>
<body>
<div class="kart">
  <img src="simge.jpg" alt="Gladiator Dice">
  <h1>GLADIATOR DICE</h1>
  <p>Osmanlı arenasında sıra tabanlı zar savaşları.<br>Ücretsiz • Android</p>

  <a id="indir" class="buton" href="https://play.google.com/store/apps/details?id=com.ersal.gladiatordice">
    Google Play'den İndir
  </a>

  <p id="ipucu" class="ipucu">
    Açılmazsa sağ üstteki <b>⋮</b> menüsünden <b>"Tarayıcıda aç"</b> deyip tekrar dokun.
  </p>

  <div id="ios" class="ios">
    Gladiator Dice şimdilik yalnızca <b>Android</b>'de.<br>iPhone sürümü yakında!
  </div>
</div>

<script>
  // ANDROID: Instagram/Facebook'un iç tarayıcısı play.google.com'un Play Store
  // uygulamasına geçişini çoğu zaman yapamıyor. "intent:" bağlantısı Play Store
  // uygulamasını doğrudan açıyor; açılamazsa tarayıcı web adresine düşüyor.
  var PAKET = "com.ersal.gladiatordice";
  var WEB = "https://play.google.com/store/apps/details?id=" + PAKET;
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua);
  var buton = document.getElementById("indir");

  if (android) {
    buton.href = "intent://details?id=" + PAKET +
      "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" +
      encodeURIComponent(WEB) + ";end";
  }
  if (ios) {
    document.getElementById("ios").style.display = "block";
    document.getElementById("ipucu").style.display = "none";
  }
</script>
</body>
</html>
